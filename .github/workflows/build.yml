name: Build POCO F4 Kernel for DroidSpaces

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel (munch)
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev \
            libncurses5-dev git zip curl wget ccache python3 python2

      - name: Download Proton-Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone Kernel Source (SM8250 / munch)
        run: |
          git clone --depth=1 -b lineage-20 https://github.com/xiaomi-sm8250-devs/android_kernel_xiaomi_sm8250.git kernel

      - name: Apply DroidSpaces Patches
        run: |
          cd kernel
          # Tải và áp dụng patch 1: Tránh kernel panic trong xt_qtaguid
          curl -sL "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch" | patch -p1
          
          # Tải và áp dụng patch 2: Sửa khôi phục tiền tố cgroup
          curl -sL "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch" | patch -p1

      - name: Configure DroidSpaces defconfig
        run: |
          cd kernel
          cat << 'EOF' > arch/arm64/configs/droidspaces.config
          # IPC & Message Queue
          CONFIG_SYSCTL=y
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y

          # Namespaces
          CONFIG_NAMESPACES=y
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_NET_NS=y

          # Seccomp
          CONFIG_SECCOMP=y
          CONFIG_SECCOMP_FILTER=y

          # Control groups
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_MEMCG=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_NET_PRIO=y

          # Filesystems
          CONFIG_DEVTMPFS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y

          # Firmware Loader
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y

          # Networking & Isolation
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_NETFILTER=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y

          # Tắt Paranoid Network để container truy cập internet
          CONFIG_ANDROID_PARANOID_NETWORK=n
          EOF

      - name: Build Kernel Image
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          
          # Hợp nhất defconfig cho POCO F4 (Kona base + Xiaomi Common + Munch + Droidspaces)
          ./scripts/kconfig/merge_config.sh -m -O out \
            arch/arm64/configs/vendor/kona-perf_defconfig \
            arch/arm64/configs/vendor/xiaomi/sm8250-common.config \
            arch/arm64/configs/vendor/xiaomi/munch.config \
            arch/arm64/configs/droidspaces.config

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          # Tùy chỉnh thông tin AnyKernel cho POCO F4
          sed -i 's/device.name1=.*/device.name1=munch/g' anykernel.sh
          sed -i 's/device.name2=.*/device.name2=munchin/g' anykernel.sh
          sed -i 's/device.name3=.*/device.name3=Redmi K40S/g' anykernel.sh
          sed -i 's/device.name4=.*/device.name4=POCO F4/g' anykernel.sh
          sed -i 's/is_slot_device=.*/is_slot_device=auto;/g' anykernel.sh
          
          # Sao chép file Image đã build
          cp ../kernel/out/arch/arm64/boot/Image .
          
          # Đóng gói zip
          zip -r9 ../AnyKernel3-munch-DroidSpaces.zip * -x .git README.md *placeholder

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-munch-DroidSpaces
          path: AnyKernel3-munch-DroidSpaces.zip
